name: Bug Report
description: Report a bug or an issue with the extension.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What version of ComfyUI-RS_WorkspaceManager are you using? (e.g., v1.0.0)
    validations:
      required: true
  - type: input
    id: comfy_version
    attributes:
      label: ComfyUI Version
      description: What version of ComfyUI are you using? (e.g., v0.3.47)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: Please paste any relevant errors from your browser console (F12 -> Console) or terminal.
      render: shell